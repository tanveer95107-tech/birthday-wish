<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday Jamal</title>
<style>
:root{--bg:#14000a;--gold:#f7dca8;--rose:#eab5ae;--line:rgba(247,220,168,.35);--card:rgba(70,0,18,.45)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg) repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.013) 38px 40px);color:var(--gold);font-family:Georgia,'Times New Roman',serif;text-align:center}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 25%,rgba(130,0,35,.35),transparent 70%);pointer-events:none}
[hidden]{display:none!important}
/* one screen at a time */
.scr{position:absolute;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;gap:16px;padding:32px 18px 28px;overflow-y:auto;opacity:0;filter:blur(14px);transform:translateY(20px);transition:opacity .8s,filter .8s,transform .8s}
.scr.on{display:flex}.scr.in{opacity:1;filter:none;transform:none}
.scr::before,.scr::after{content:"";margin-block:auto}
.calli{font-family:'Brush Script MT','Segoe Script','Snell Roundhand','Apple Chancery',cursive;font-weight:400;color:var(--rose)}
h1{font-size:clamp(3rem,12vw,5.5rem);line-height:1.1}
h2{font-size:clamp(1.6rem,5.5vw,2.6rem);line-height:1.45;font-weight:700}
.sub{font-style:italic;font-size:.95rem;line-height:1.6;opacity:.9;max-width:440px}
.ask{font-style:italic;color:var(--rose);font-size:1.02rem;max-width:420px;line-height:1.5}
.reply{font-family:'Brush Script MT','Segoe Script','Snell Roundhand','Apple Chancery',cursive;color:var(--rose);font-size:1.35rem;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.btn{border:1px solid var(--gold);background:transparent;color:var(--gold);font:700 .72rem Georgia,'Times New Roman',serif;letter-spacing:2px;text-transform:uppercase;padding:14px 26px;cursor:pointer;transition:.3s;text-decoration:none;display:inline-block}
.btn:hover,.btn.fill{background:var(--gold);color:#3b0012;box-shadow:0 0 22px rgba(247,220,168,.55)}
.nx{animation:pop .6s}
.nx[hidden],#remQ[hidden]{display:inline-block!important;visibility:hidden;animation:none}
#remQ[hidden]{display:block!important}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.ph{position:relative;background:linear-gradient(135deg,#5a1020,#2a0510);overflow:hidden}
.ph::after{content:"+ your photo";position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem;opacity:.45}
.ph img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
.frame{width:min(480px,86vw);aspect-ratio:16/9;max-height:30dvh;border:1px solid rgba(255,255,255,.45)}
.arch{width:min(250px,60vw,calc(40dvh*.8));aspect-ratio:4/5;border-radius:999px 999px 14px 14px;border:1px solid rgba(247,220,168,.6);box-shadow:0 0 0 6px rgba(20,0,10,.9),0 0 0 7px rgba(247,220,168,.28),0 0 44px rgba(234,181,174,.3)}
.arch::after{display:none}
.pol .pic img{object-position:50% 22%}
.row{display:flex;gap:12px;justify-content:center}
.card,.pol{position:relative;display:block;font:inherit;color:inherit;text-align:center;background:var(--card);border:1px solid rgba(255,255,255,.12);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .35s,box-shadow .35s,border-color .35s,opacity .35s}
.card{width:clamp(96px,28vw,150px);padding:0}
.card .pic{display:block;aspect-ratio:4/5;width:100%}
.card .t{display:block;padding:10px 4px;font-size:.82rem;line-height:1.3}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(720px,94vw)}
.pol{padding:8px 8px 0}
.pol .pic{display:block;aspect-ratio:3/4;max-height:25dvh;width:100%}
.pol .t{display:block;font-family:'Brush Script MT','Segoe Script','Snell Roundhand','Apple Chancery',cursive;color:var(--rose);font-size:clamp(.95rem,3.4vw,1.5rem);padding:10px 2px}
@media(hover:hover){.card:hover,.pol:hover{border-color:var(--gold);box-shadow:0 0 22px rgba(247,220,168,.3);transform:translateY(-3px)}}
.card:focus-visible,.pol:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.card.sel,.pol.sel{border-color:var(--gold)!important;box-shadow:0 0 26px rgba(247,220,168,.5);transform:scale(1.07);z-index:2}
.card.sel::after,.pol.sel::after{content:"♥";position:absolute;top:-10px;right:-10px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#b3122f;display:grid;place-items:center;font-size:.85rem;box-shadow:0 0 12px rgba(247,220,168,.7);animation:pop .4s}
.row.picked .card:not(.sel){opacity:.55}
.row.hint .card{animation:nudge 1.9s ease-in-out infinite}
.row.hint .card:nth-child(2){animation-delay:.25s}.row.hint .card:nth-child(3){animation-delay:.5s}
@keyframes nudge{0%,55%,100%{transform:none}28%{transform:translateY(-7px)}}
.np{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);font-size:1.5rem;min-height:1.8em}
.np[hidden]{display:flex!important;visibility:hidden}
.eq{display:none;align-items:flex-end;gap:3px;height:16px}
.np.live .eq{display:flex}
.eq i{width:3px;background:var(--gold);border-radius:2px;transform-origin:bottom;animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(1){height:60%}.eq i:nth-child(2){height:100%;animation-delay:.2s}.eq i:nth-child(3){height:40%;animation-delay:.4s}
@keyframes eq{to{transform:scaleY(.3)}}
.tl{width:min(460px,90vw);text-align:left;padding-left:26px;border-left:1px solid var(--line)}
.tl div{position:relative;margin-bottom:18px;opacity:0;transform:translateX(-16px);transition:1s}
.tl div.in{opacity:1;transform:none}
.tl div::before{content:"❤️";position:absolute;left:-36px;top:2px;font-size:.75rem;background:var(--bg);padding:2px 0}
.tl b{font-family:'Brush Script MT','Segoe Script','Snell Roundhand','Apple Chancery',cursive;font-weight:400;color:var(--rose);font-size:1.45rem;display:block}
.tl span{font-size:.9rem;line-height:1.6;opacity:.9}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.sec{display:flex;flex-direction:column;gap:12px;width:min(430px,90vw)}
.sc{border:1px solid var(--line);background:var(--card);padding:16px 18px;cursor:pointer;text-align:left;transition:.4s}
.sc b{font-family:'Brush Script MT','Segoe Script','Snell Roundhand','Apple Chancery',cursive;font-weight:400;color:var(--rose);font-size:1.45rem;display:block}
.sc span{display:block;max-height:0;opacity:0;overflow:hidden;font-size:.92rem;line-height:1.65;transition:max-height .8s,opacity .8s,margin .8s}
.sc.open{border-color:var(--gold);box-shadow:0 0 22px rgba(247,220,168,.25)}
.sc.open span{max-height:160px;opacity:.95;margin-top:8px}
.sc small{font-size:.75rem;opacity:.55;font-style:italic}
.sc.open small{display:none}
.letter{font-family:Papyrus,Kalam,cursive;font-size:clamp(1.1rem,3.6vw,1.5rem);line-height:1.45;text-align:left;white-space:pre-wrap;border:1px solid var(--line);background:rgba(0,0,0,.25);padding:22px;width:min(540px,92vw);min-height:180px;max-height:62dvh;overflow-y:auto;cursor:pointer;scrollbar-width:thin}
.qbox{border:1px solid var(--line);background:var(--card);padding:26px;width:min(400px,92vw)}
.qbox h3{font-size:1.3rem;line-height:1.4;margin-bottom:6px}
.opt{display:block;width:100%;margin-top:10px;padding:13px;font:700 .85rem system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--gold);background:transparent;border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:.25s}
.opt:hover,.opt.sel{background:#e3a99b;color:#2b0710}
.chips .opt{width:auto;margin:0;padding:12px 18px}
#cake{width:min(270px,70vw);max-height:36dvh;filter:drop-shadow(0 0 28px rgba(247,180,90,.25))}
.fl{cursor:pointer;transition:opacity .7s}.fl.off{opacity:0;pointer-events:none}
.f{transform-box:fill-box;transform-origin:50% 100%;animation:fk .45s ease-in-out infinite alternate}
@keyframes fk{to{transform:scale(.88,1.1) rotate(4deg)}}
.cert{width:min(540px,92vw);border:2px solid var(--rose);padding:30px 22px;background:rgba(40,0,10,.8);box-shadow:0 0 34px rgba(234,181,174,.45),inset 0 0 0 7px rgba(40,0,10,.8),inset 0 0 0 8px var(--rose)}
.cert .calli{font-size:clamp(1.7rem,6vw,2.3rem)}
textarea{width:min(440px,90vw);min-height:110px;resize:none;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--gold);font:1.05rem/1.5 'Segoe Print','Bradley Hand','Comic Sans MS',cursive;padding:14px;outline:none}
textarea:focus{border-color:var(--gold)}
textarea::placeholder{color:rgba(247,220,168,.45)}
.heart{position:fixed;top:-30px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(40deg)}}
@media(max-height:760px){.scr{gap:10px;padding:18px 16px}.pol .pic{max-height:16dvh}.pol{padding:6px 6px 0}.pol .t{padding:6px 2px}.frame{max-height:24dvh}.arch{width:min(250px,60vw,calc(32dvh*.8))}.tl div{margin-bottom:10px}.reply{min-height:2.2em}.sc{padding:11px 16px}.sc.open span{margin-top:4px}h2{line-height:1.3}}
@media(min-width:900px) and (min-aspect-ratio:3/2){.grid{grid-template-columns:repeat(6,1fr);width:min(1040px,94vw)}.pol .pic{max-height:none}.pol{padding:8px 8px 0}.pol .t{padding:8px 2px}}
@media(prefers-reduced-motion:reduce){.scr{transition:none;filter:none}.heart{display:none}.row.hint .card,.eq i{animation:none}}

/* ---- prettier look ---- */
body{background:radial-gradient(ellipse at 50% 0%,#5a0a2a 0%,#2a0414 45%,#14000a 100%)}
body::before{background:radial-gradient(circle at 20% 30%,rgba(255,170,120,.12),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,120,170,.12),transparent 45%)}
h1.calli{background:linear-gradient(180deg,#fff1cf,#f0b97a 55%,#eab5ae);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 18px rgba(247,180,120,.35))}
h2{text-shadow:0 2px 14px rgba(0,0,0,.35)}
.btn{border-radius:999px;border:1px solid rgba(247,220,168,.7);padding:14px 30px;backdrop-filter:blur(4px);box-shadow:0 0 18px rgba(247,220,168,.15)}
.btn.fill{background:linear-gradient(135deg,#f7dca8,#eab5ae);color:#4a0a1c;border-color:transparent;box-shadow:0 6px 22px rgba(234,181,174,.35)}
.btn:hover,.btn.fill:hover{box-shadow:0 0 28px rgba(247,220,168,.7);transform:translateY(-1px)}
.arch{box-shadow:0 0 0 6px rgba(20,0,10,.9),0 0 0 7px rgba(247,220,168,.5),0 0 60px rgba(234,181,174,.45)}
.pol{border-radius:14px;background:linear-gradient(160deg,rgba(110,10,40,.55),rgba(50,0,18,.55));box-shadow:0 8px 22px rgba(0,0,0,.35)}
.pol .pic{border-radius:10px}
.tl{border-left:1px solid rgba(247,220,168,.5)}
.qbox{border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.opt{border-radius:12px}
.portrait{width:min(300px,72vw);aspect-ratio:3/4;max-height:56dvh;border-radius:26px;border:2px solid rgba(247,220,168,.75);box-shadow:0 0 0 7px rgba(20,0,10,.9),0 0 0 8px rgba(247,220,168,.35),0 0 60px rgba(255,140,150,.4)}
.portrait::after{display:none}
.portrait img{object-position:50% 18%}
.cert{border-radius:22px;background:linear-gradient(160deg,rgba(90,10,35,.85),rgba(40,0,14,.9));box-shadow:0 0 40px rgba(234,181,174,.4),inset 0 0 0 7px rgba(40,0,10,.8),inset 0 0 0 8px var(--rose)}
textarea{border-radius:14px}
.heartbox{font-family:Georgia,serif;font-style:italic;font-size:clamp(1rem,3.4vw,1.2rem);line-height:1.7;border-radius:20px;cursor:default;background:linear-gradient(160deg,rgba(90,10,35,.6),rgba(40,0,14,.7));box-shadow:0 10px 30px rgba(0,0,0,.35)}</style>
</head>
<body>

<!-- 0 HERO -->
<section class="scr" id="s0">
  <div class="arch ph" id="heroPic"></div>
  <h1 class="calli">Happy Birthday</h1>
  <h2 id="name"></h2>
  <p class="sub" id="heroSub"></p>
  <button class="btn" id="openBtn">Open My Gift</button>
</section>

<!-- 1 MEMORIES -->
<section class="scr" id="s1">
  <h2 class="calli" style="font-size:clamp(2rem,7vw,3rem)">Good Memories</h2>
  <p class="ask" id="memAsk"></p>
  <div class="grid" id="memories"></div>
  <p class="reply"></p>
  <button class="btn fill nx" hidden>Next</button>
</section>

<!-- 2 REMEMBER WHEN -->
<section class="scr" id="s2">
  <h2 class="calli" style="font-size:clamp(2rem,7vw,3rem)">Remember When...</h2>
  <p class="sub" id="since" hidden></p>
  <div class="tl" id="timeline"></div>
  <div id="remQ" hidden><p class="ask" id="remAsk"></p><div class="chips" id="remChips"></div></div>
  <p class="reply"></p>
  <button class="btn fill nx" hidden>Next</button>
</section>

<!-- 3 FROM MY HEART -->
<section class="scr" id="s3">
  <h2 class="calli" style="font-size:clamp(2rem,7vw,3rem)">A Few Words</h2>
  <div class="letter heartbox" id="heartTxt"></div>
  <button class="btn fill nx">Continue</button>
</section>

<!-- 4 QUIZ -->
<section class="scr" id="s4">
  <p class="ask">One small quiz, just for fun</p>
  <div class="qbox" id="quizBox"><h3 id="question"></h3><div id="options"></div></div>
  <button class="btn fill" id="win" hidden>Make a Wish</button>
</section>

<!-- 4 CAKE -->
<section class="scr" id="s5">
  <h2 class="calli" style="font-size:clamp(2rem,7vw,3rem)">Make a Wish</h2>
  <svg id="cake" viewBox="0 0 240 210">
    <ellipse cx="120" cy="192" rx="106" ry="12" fill="#3a0a16"/>
    <rect x="30" y="130" width="180" height="60" rx="10" fill="#8c1d3a"/>
    <path d="M30 140q15 14 30 0t30 0 30 0 30 0 30 0 30 0v-10H30z" fill="#f7dca8"/>
    <rect x="62" y="88" width="116" height="44" rx="9" fill="#a82a4b"/>
    <path d="M62 98q14.5 13 29 0t29 0 29 0 29 0v-10H62z" fill="#f7dca8"/>
    <g fill="#eab5ae"><rect x="86" y="62" width="9" height="28" rx="2"/><rect x="115" y="62" width="9" height="28" rx="2"/><rect x="144" y="62" width="9" height="28" rx="2"/></g>
    <g class="fl"><circle cx="90.5" cy="48" r="20" fill="transparent"/><path class="f" d="M90.5 34c6 8 7 14 0 20-7-6-6-12 0-20z" fill="#ffc94d"/></g>
    <g class="fl"><circle cx="119.5" cy="48" r="20" fill="transparent"/><path class="f" d="M119.5 34c6 8 7 14 0 20-7-6-6-12 0-20z" fill="#ffc94d"/></g>
    <g class="fl"><circle cx="148.5" cy="48" r="20" fill="transparent"/><path class="f" d="M148.5 34c6 8 7 14 0 20-7-6-6-12 0-20z" fill="#ffc94d"/></g>
  </svg>
  <p class="sub" id="wishTxt">Close your eyes, make a wish, then tap each flame to blow it out.</p>
  <button class="btn fill" id="toFinal" hidden>Open Your Surprise</button>
</section>

<!-- 5 CERTIFICATE -->
<section class="scr" id="s6">
  <div class="portrait ph" id="finalPic"></div>
  <div class="cert">
    <p class="calli">Certificate of Your Day</p>
    <h2 id="certTitle"></h2>
    <p class="sub" id="certText" style="margin:10px auto 0"></p>
    <p class="calli" style="font-size:clamp(2.2rem,8vw,3.2rem);margin-top:8px">Happy Birthday! 🎂</p>
  </div>
  <button class="btn fill" id="toReply">One Last Thing</button>
</section>

<!-- 6 REPLY -->
<section class="scr" id="s7">
  <h2 class="calli" style="font-size:clamp(2rem,7vw,3rem)" id="replyTitle"></h2>
  <p class="ask" id="replyAsk"></p>
  <div class="chips" id="quick"></div>
  <textarea id="msg" placeholder="Write whatever you feel..."></textarea>
  <button class="btn fill" id="send">Send</button>
  <p class="reply" id="thanks"></p>
</section>

<script>
/* ===== Text settings ===== */
const C = {
  name: "Jamal",                           // shows on the first screen
  from: "Tanveer",
  phone: "923339917323",                               // YOUR WhatsApp number with country code, digits only. Example: "923001234567"
  metDate: "",                             // optional: the day you met, "2022-03-14". Shows "X days since the day we met"
  hero: IMG.hero,                          // her best photo, shown first
  heroSub: "Another year, and I still wish you only the best. This is a small thank-you for the good days we shared.",

  memAsk: "Tap the memory that still makes you smile.",
  memReply: "Some good memories stay with us, always.",
  memories: [
    { img: IMG.m1, cap: "Side by side." },
    { img: IMG.m2, cap: "Cloudy, yet happy." },
    { img: IMG.m3, cap: "That smile." },
    { img: IMG.m4, cap: "Your peace sign." },
    { img: IMG.m5, cap: "Your silly side." },
    { img: IMG.m6, cap: "Soft moments." }
  ],

  timeline: [
    { t: "The day we met", d: "I was nervous, and you made it easy. I am thankful for that day." },
    { t: "Our long conversations", d: "Hours felt like minutes. Those talks taught me a lot." },
    { t: "The little things", d: "Your laugh, your care. I noticed it all, and I will not forget it." },
    { t: "Our good days", d: "Nothing planned, and still some of the happiest days I have had." }
  ],
  remAsk: "Do you remember?",
  remOpts: ["Yes, I do", "A little", "Every bit of it"],
  remReply: "Thank you for every one of those days.",

  heart: "{name},\n\nHappy Birthday.\n\nSome people stay in your memories without needing a reason. You are one of them.\n\nI am grateful for the time we had: the laughs, the lessons, the good days. Those are mine to keep, and I carry them with respect.\n\nI hope this year is gentle with you. I hope you get everything you are working for, and people who value you the way you deserve.\n\nNo expectations, no conditions. Just a sincere wish from someone who knew you well.\n\nTake care of yourself.\n\n{from}",

  quiz: [                                  // ans = right option number (0 = first)
    { q: "What do I wish for you today?", o: ["Lots of cake", "Endless happiness", "All your dreams coming true", "All of the above"], ans: 3 },
    { q: "What do I remember most about you?", o: ["Your laugh", "Your kindness", "Your smile", "Everything"], ans: 3 }
  ],

  final: IMG.final,                        // the dance photo above the certificate
  certTitle: "The Brightest Soul I Know",
  certText: "With respect, gratitude and every good wish for a year as bright as your smile.",

  replyTitle: "If This Made You Smile",
  replyAsk: "No pressure. Reply only if you feel like it.",
  quick: ["Thank you 🤍", "I remember it too", "Take care"],
  thanks: "Thank you for reading this. Happy Birthday, and take care. 🤍"
};
/* ========================================================= */

const $ = s => document.querySelector(s);
const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h) e.innerHTML = h; return e; };
const pic = src => { const i = new Image(); i.src = src; i.alt = ""; i.onerror = () => i.remove(); return i; };
const scr = [...document.querySelectorAll(".scr")];
let cur = 0, busy = false;

// ---------- screens: one at a time, no scrolling between them ----------
function go(n) {
  if (busy) return; busy = true;
  scr[cur].classList.remove("in");
  setTimeout(() => {
    scr[cur].classList.remove("on");
    scr[n].classList.add("on"); scr[n].scrollTop = 0;
    void scr[n].offsetWidth; scr[n].classList.add("in");
    cur = n; enter(n); busy = false;
  }, 550);
}
scr.forEach((s, i) => { const b = s.querySelector(".nx"); if (b) b.onclick = () => go(i + 1); });
function unlock(i, msg) { const s = scr[i]; if (msg) s.querySelector(".reply").textContent = msg; s.querySelector(".nx").hidden = false; }
scr[0].classList.add("on"); requestAnimationFrame(() => scr[0].classList.add("in"));

// ---------- build content ----------
$("#name").textContent = C.name; $("#heroSub").textContent = C.heroSub;
$("#memAsk").textContent = C.memAsk; $("#remAsk").textContent = C.remAsk;
$("#heroPic").append(pic(C.hero)); $("#finalPic").append(pic(C.final));
$("#heartTxt").textContent = C.heart.replace(/\{name\}/g, C.name).replace(/\{from\}/g, C.from);
$("#certTitle").textContent = C.certTitle; $("#certText").textContent = C.certText;
$("#replyTitle").textContent = C.replyTitle; $("#replyAsk").textContent = C.replyAsk;

if (C.metDate) {
  const days = Math.floor((Date.now() - new Date(C.metDate)) / 864e5);
  if (days > 0) { $("#since").textContent = days.toLocaleString() + " days since the day we met"; $("#since").hidden = false; }
}
function pick(box, el) { box.querySelectorAll(".sel").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); }
C.memories.forEach(m => {
  const d = mk("button", "pol", '<span class="pic ph"></span><span class="t"></span>'); d.type = "button";
  d.querySelector(".pic").append(pic(m.img)); d.querySelector(".t").textContent = m.cap;
  d.onclick = () => { pick($("#memories"), d); unlock(1, C.memReply); };
  $("#memories").append(d);
});
C.timeline.forEach(t => {
  const d = mk("div", "", "<b></b><span></span>"); d.querySelector("b").textContent = t.t; d.querySelector("span").textContent = t.d;
  $("#timeline").append(d);
});
C.remOpts.forEach(o => { const b = mk("button", "opt"); b.textContent = o; b.onclick = () => unlock(2, C.remReply); $("#remChips").append(b); });

// ---------- what happens when each screen opens ----------
function enter(n) {
  if (n === 2) {
    const items = [...document.querySelectorAll("#timeline div")];
    items.forEach((x, i) => setTimeout(() => x.classList.add("in"), 400 + i * 800));
    setTimeout(() => $("#remQ").hidden = false, 600 + items.length * 800);
  }
  if (n === 6) confetti();
}

// quiz
let qi = 0;
function showQuestion() {
  if (qi >= C.quiz.length) {
    $("#quizBox").innerHTML = '<h2 class="calli" style="font-size:2.3rem">Well remembered! 🎉</h2>';
    $("#win").hidden = false; return;
  }
  const d = C.quiz[qi]; $("#question").textContent = d.q;
  const box = $("#options"); box.innerHTML = "";
  d.o.forEach((opt, idx) => {
    const b = mk("button", "opt"); b.textContent = opt;
    b.onclick = () => { if (idx === d.ans) { qi++; showQuestion(); } else { b.textContent = "Try again..."; setTimeout(() => b.textContent = opt, 1000); } };
    box.append(b);
  });
}
showQuestion();
$("#win").onclick = () => go(5);

// cake: tap each flame to blow it out
let out = 0;
document.querySelectorAll(".fl").forEach(f => f.onclick = () => {
  if (f.classList.contains("off")) return;
  f.classList.add("off");
  if (++out === 3) {
    $("#wishTxt").textContent = "Your wish is on its way. Happy Birthday!";
    confetti(); setTimeout(() => $("#toFinal").hidden = false, 1200);
  }
});
$("#toFinal").onclick = () => go(6);
$("#toReply").onclick = () => go(7);

// reply: she writes, it opens WhatsApp to you with her message ready to send
C.quick.forEach(q => {
  const b = mk("button", "opt"); b.textContent = q;
  b.onclick = () => { pick($("#quick"), b); b.classList.add("sel"); $("#msg").value = q; };
  $("#quick").append(b);
});
if (!C.phone) $("#send").hidden = true;
$("#send").onclick = () => {
  const m = $("#msg").value.trim() || $("#quick .sel")?.textContent || "";
  if (!m) { $("#msg").focus(); return; }
  $("#thanks").textContent = C.thanks;
  window.open("https://wa.me/" + C.phone + "?text=" + encodeURIComponent(m), "_blank");
};

// ---------- hearts, confetti ----------
let hc = ["❤️"];
function spawn() {
  if (document.querySelectorAll(".heart").length > 60) return;
  const h = mk("div", "heart", hc[Math.floor(Math.random() * hc.length)]);
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = 10 + Math.random() * 14 + "px";
  h.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
  h.style.animationDuration = 6 + Math.random() * 6 + "s";
  document.body.append(h); setTimeout(() => h.remove(), 12500);
}
setInterval(spawn, 450);
